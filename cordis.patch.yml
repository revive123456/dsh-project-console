# dsh-project-console 的组合层（bundle layer）。
#
# profile 的 package.json 在 dsh.profile.bundles 里列出本包名后，启动器按顺序
# 叠加各 bundle 的 patch；本文件把插件挂到组合树上，并声明工程台专用的窄 agent preset。
#   - id：组合内唯一的行 id（profile 的 patch 层用它覆盖本行）
#   - name：Node 模块标识符 = npm 包名；启动器据此解析本包 host 入口
# 两者都写包名；build.mjs 的 client module id 必须与包名一致。
- insert:
    - id: dsh-project-console
      name: dsh-project-console

    # 工程台 lead 专用 preset：只读工具面（read/glob/grep）+ compaction，不给 bash/write/edit。
    # 实测每请求 tool schema 从 ~39KB 降到 ~10–13KB；改完必须重建 lead 会话才生效。
    - id: project-lead-preset
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: project-lead
        order: 50
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: "你是工程台 Project Console 的调度员：接需求、拆任务、派发、集成；不直接改代码，不自己验收。回答先结论后理由，短而可执行。"
              includeRuntimeContext: false
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              read: false
              readImage: false
              write: false
              edit: false
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
